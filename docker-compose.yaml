services:
  nuxt:
    image: node:22-bookworm
    working_dir: /app
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: filemanager
      POSTGRES_USER: filemanager
      POSTGRES_PASSWORD: filemanager
    ports:
      - "5433:5432"
    volumes:
      -   personal_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemanager -d filemanager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  node_modules:
  personal_postgres_data:
