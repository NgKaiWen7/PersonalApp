services:
  database:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - personal_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  nuxt:
    image: node:22-bookworm
    working_dir: /app
    command: ["sh", "-c", "npm run build && nodejs .output/server/index.mjs"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - /mnt/data:/data
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped
volumes:
  node_modules:
  personal_postgres_data:
