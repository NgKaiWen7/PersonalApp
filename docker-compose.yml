services:
  backend:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: go run .
    restart: unless-stopped
  frontend:
    image: node:22-bookworm
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: filemanager
      POSTGRES_USER: filemanager
      POSTGRES_PASSWORD: filemanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemanager -d filemanager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
