services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: filemanager
      POSTGRES_USER: filemanager
      POSTGRES_PASSWORD: filemanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemanager -d filemanager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
